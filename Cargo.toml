[package]
name = "wren-browser"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "wren-browser"
path = "src/main/main.rs"

[dependencies]
wren = { path = ".wren/runtime/wren-rust" }
ureq = { version = "3.4.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Only platform/macos/ may use these (src/main/platform/mod.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CATransaction"] }
dispatch2 = "0.3.1"
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
