# Installs the release of Wren Runtime that wren-app.json names, as
# `wren install` does for a contributor, and links it at .wren/runtime. The
# release is over 400 MB, so it is kept between runs, by its version.
name: Install Wren Runtime
description: Installs the Wren Runtime release that wren-app.json names.

runs:
  using: composite
  steps:
    - name: Read the Wren Runtime version
      id: runtime
      shell: bash
      run: echo "version=$(jq -r .wren wren-app.json)" >> "$GITHUB_OUTPUT"

    - name: Restore Wren Runtime
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.wren/runtimes/${{ steps.runtime.outputs.version }}
        key: wren-runtime-${{ steps.runtime.outputs.version }}

    # `wren install` asks GitHub's API for the release. Without a token,
    # runners share an hourly limit by address that is often already spent.
    - name: Install Wren Runtime
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        curl -fsSL https://wrenbrowser.com/runtime/cli/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/wren" install --manifest wren-app.json
