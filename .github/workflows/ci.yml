# Runs `bun run check` and the Rust tests, and checks the formatting, on every
# push to main and every pull request, as a contributor runs them before a
# commit. Each is a job of its own, so each reports on its own, and a failed
# check doesn't keep the tests from running. Formatting needs no Wren Runtime,
# so it runs on Linux, which starts sooner and costs less than macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the packages
        run: bun install --frozen-lockfile

      - name: Check the formatting with Prettier
        run: bunx prettier --check .

      - name: Check the formatting with rustfmt
        run: cargo fmt --check

  # On macOS on Apple silicon, the only platform Wren Runtime ships for, with
  # the release of it that wren-app.json names, as `bun run build` does.
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Restore Rust's build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Wren Runtime
        uses: ./.github/actions/wren-runtime

      - name: Install the packages
        run: bun install --frozen-lockfile

      - name: Run the checks
        run: bun run check

  # On macOS too, as the test binary loads Wren Runtime's framework from the
  # release, which .cargo/config.toml points it at.
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Restore Rust's build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Wren Runtime
        uses: ./.github/actions/wren-runtime

      - name: Run the Rust tests
        run: bun run test:cargo
